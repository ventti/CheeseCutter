# Documentation manifest — every doc in the repo, and the mechanism that keeps it true.
#
# The problem this solves: documentation does not rot because people are careless, it rots
# because most documents have NO mechanism that would notice. This file makes the mechanism
# an explicit, checked property of each doc. tests/test_docs_manifest.py fails if a tracked
# doc is missing from here, if a listed doc is missing from disk, or if a `generator`/`reader`
# claim is untrue — so adding a document requires a deliberate decision about how it stays
# honest, which is exactly the friction an agent session lacks.
#
# category (pick the strongest that applies):
#   generated  — written by a tool from code. Cannot drift; CI regenerates and diffs it.
#   tested     — prose whose content is asserted by a test. Rots loudly, not silently.
#   decision   — an ADR. Append-only, superseded but never edited; cannot go stale because
#                it only ever claimed to record a decision made on a date.
#   prose      — hand-written and hand-maintained. The only category with no automatic
#                guard, so keep it small, owned, and reviewed in the same PR as the code.
#   agent      — instructions/config consumed by AI agents (CLAUDE.md, skills, subagents).
#   vendor     — upstream/third-party text we do not maintain.
#
# NOT a category: plans, audits, review findings, loop logs, progress reports. Those are
# session state — keep them in .scratch/ (gitignored). See CLAUDE.md.

