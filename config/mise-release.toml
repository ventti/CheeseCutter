# Explicit, authenticated release-task catalog. This filename is intentionally
# outside mise's automatic project-config discovery.
#
# Examples:
#   MISE_CONFIG_FILE=config/mise-release.toml mise tasks ls
#   MISE_CONFIG_FILE=config/mise-release.toml mise run release:<task>
#
# MISE_CONFIG_FILE adds this overlay to the normal project config, retaining the
# local build-release task and RELEASE_* environment from mise.toml.
[task_config]
includes = [
  "git::https://github.com/superteppo/release-scripts.git//mise-tasks?ref=main",
]
